<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🌾 Soil Crop Suitability Predictor</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background: linear-gradient(to right, #e3f9e5, #fefaf6);
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>

<body class="flex items-center justify-center min-h-screen">
  <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-lg">
    <h1 class="text-2xl font-bold text-center text-green-700 mb-6">
      🌾 Soil Crop Suitability Predictor
    </h1>

    <form id="predictionForm" class="space-y-4">
      <!-- State -->
      <div>
        <label class="block font-semibold mb-1">State</label>
        <select id="State" class="w-full border rounded-lg p-2" required>
          <option value="">Select State</option>
          <option value="Maharashtra">Maharashtra</option>
          <option value="Gujarat">Gujarat</option>
          <option value="Karnataka">Karnataka</option>
          <option value="Madhya Pradesh">Madhya Pradesh</option>
        </select>
      </div>

      <!-- District -->
      <div>
        <label class="block font-semibold mb-1">District</label>
        <input
          type="text"
          id="District"
          class="w-full border rounded-lg p-2"
          placeholder="e.g., Nashik"
          required
        />
      </div>

      <!-- Farmer ID -->
      <div>
        <label class="block font-semibold mb-1">Farmer ID</label>
        <input
          type="text"
          id="Farmer_ID"
          class="w-full border rounded-lg p-2"
          placeholder="e.g., F101"
          required
        />
      </div>

      <!-- Soil Type -->
      <div>
        <label class="block font-semibold mb-1">Soil Type</label>
        <select id="Soil_Type" class="w-full border rounded-lg p-2" required>
          <option value="">Select Soil Type</option>
          <option value="Loamy">Loamy</option>
          <option value="Sandy">Sandy</option>
          <option value="Clayey">Clayey</option>
          <option value="Silty">Silty</option>
        </select>
      </div>

      <!-- Numeric Inputs -->
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block font-semibold mb-1">pH</label>
          <input type="number" id="pH" step="0.1" class="w-full border rounded-lg p-2" required />
        </div>
        <div>
          <label class="block font-semibold mb-1">EC</label>
          <input type="number" id="EC" step="0.1" class="w-full border rounded-lg p-2" required />
        </div>
        <div>
          <label class="block font-semibold mb-1">OC</label>
          <input type="number" id="OC" step="0.1" class="w-full border rounded-lg p-2" required />
        </div>
        <div>
          <label class="block font-semibold mb-1">N</label>
          <input type="number" id="N" class="w-full border rounded-lg p-2" required />
        </div>
        <div>
          <label class="block font-semibold mb-1">P</label>
          <input type="number" id="P" class="w-full border rounded-lg p-2" required />
        </div>
        <div>
          <label class="block font-semibold mb-1">K</label>
          <input type="number" id="K" class="w-full border rounded-lg p-2" required />
        </div>
        <div class="col-span-2">
          <label class="block font-semibold mb-1">Moisture</label>
          <input type="number" id="Moisture" step="0.1" class="w-full border rounded-lg p-2" required />
        </div>
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        class="w-full bg-green-600 text-white font-semibold py-2 rounded-lg hover:bg-green-700 transition"
      >
        🌿 Predict Suitability
      </button>
    </form>

    <!-- Output -->
    <div id="result" class="mt-6 text-center text-lg font-semibold text-green-700"></div>
  </div>

  <script>
    const form = document.getElementById("predictionForm");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const formData = {
        State: document.getElementById("State").value,
        District: document.getElementById("District").value,
        Farmer_ID: document.getElementById("Farmer_ID").value,
        Soil_Type: document.getElementById("Soil_Type").value,
        pH: parseFloat(document.getElementById("pH").value),
        EC: parseFloat(document.getElementById("EC").value),
        OC: parseFloat(document.getElementById("OC").value),
        N: parseFloat(document.getElementById("N").value),
        P: parseFloat(document.getElementById("P").value),
        K: parseFloat(document.getElementById("K").value),
        Moisture: parseFloat(document.getElementById("Moisture").value),
      };

      const response = await fetch("http://127.0.0.1:5000/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(formData),
      });

      const result = await response.json();
      const outputDiv = document.getElementById("result");

      if (result.status === "success") {
        outputDiv.innerHTML = `🌾 <b>Predicted Crop Suitability:</b> ${result.predicted_crop_suitability}`;
      } else {
        outputDiv.innerHTML = `❌ Error: ${result.message}`;
      }
    });
  </script>
</body>
</html>
